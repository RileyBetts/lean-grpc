name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: leanprover/lean-action@f3ad22e9ca29cb9475bc9bee9afd1f39bb52bf6d # v1.1.2
        with:
          test: false
      - name: Install OpenSSL headers (TLS FFI)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config zlib1g-dev
      - name: OpenSSL header fallback (no-op when system headers present)
        run: |
          chmod +x scripts/fetch-openssl-headers.sh
          ./scripts/fetch-openssl-headers.sh
      - name: Build libraries and tests
        run: lake build Proofs bytesTests hpackTests h2Tests grpcTests securityTests trailersServer trailersLoopback tlsServer tlsLoopback helloworldServer helloworldClient interopServer interopClient protocGenLean4Grpc benchUnary benchSoak opsSmoke h2specServer routeGuideServer routeGuideClient adcSmoke fakeAdsServer
      - name: Formal proofs (compile-time)
        run: lake build Proofs
      - name: Unit tests
        run: |
          ./.lake/build/bin/bytesTests
          ./.lake/build/bin/hpackTests
          ./.lake/build/bin/h2Tests
          ./.lake/build/bin/grpcTests
          ./.lake/build/bin/securityTests
          ./.lake/build/bin/trailersLoopback
      - name: Native ASAN / UBSan security harness
        run: |
          chmod +x scripts/security-asan.sh
          ./scripts/security-asan.sh
      - name: Codegen smoke
        run: |
          mkdir -p /tmp/lean-grpc-gen-hw /tmp/lean-grpc-gen-rg
          LEAN_GRPC_OUT=/tmp/lean-grpc-gen-hw ./.lake/build/bin/protoc-gen-lean4-grpc Examples/helloworld.proto
          test -f /tmp/lean-grpc-gen-hw/Generated.lean
          grep -qE 'SayHello|HelloRequest' /tmp/lean-grpc-gen-hw/Generated.lean
          LEAN_GRPC_OUT=/tmp/lean-grpc-gen-rg ./.lake/build/bin/protoc-gen-lean4-grpc Examples/route_guide.proto
          test -f /tmp/lean-grpc-gen-rg/Generated.lean
          chmod +x scripts/run-codegen-fixture.sh
          ./scripts/run-codegen-fixture.sh
      - name: Native zlib + TLS
        run: |
          chmod +x scripts/build_native.sh scripts/gen-test-certs.sh scripts/interop-tls-go-lean.sh \
            scripts/fetch-openssl-headers.sh scripts/run-adc-smoke.sh scripts/run-xds-ads-smoke.sh \
            scripts/run-soak.sh scripts/mock-adc-server.py
          ./scripts/build_native.sh
          export LEAN_GRPC_ZLIB_HELPER="$PWD/.lake/build/native/zlib_helper"
          ./.lake/build/bin/grpcTests
          ./.lake/build/bin/tlsLoopback
      - name: Lean↔Lean interop cases
        run: |
          ./.lake/build/bin/interopServer &
          pid=$!
          sleep 1
          for c in empty_unary large_unary status_code_and_message custom_metadata cancel_after_begin \
                   server_streaming client_streaming ping_pong empty_stream \
                   cancel_after_first_response special_status_message unimplemented_method \
                   unimplemented_service timeout_on_sleeping_server client_compressed_unary \
                   server_compressed_unary client_compressed_streaming server_compressed_streaming \
                   pick_first_unary cacheable_unary jwt_token_creds oauth2_auth_token per_rpc_creds \
                   orca_per_rpc xds_static_unary; do
            ./.lake/build/bin/interopClient 127.0.0.1 10000 "$c"
          done
          kill $pid
      - name: ADC mock smoke
        run: ./scripts/run-adc-smoke.sh
      - name: xDS ADS smoke
        run: ./scripts/run-xds-ads-smoke.sh
      - name: Helloworld + ops + RouteGuide + soak
        run: |
          export LEAN_GRPC_DEMO_OPS=1
          ./.lake/build/bin/helloworldServer &
          pid=$!
          sleep 0.5
          ./.lake/build/bin/helloworldClient 127.0.0.1 50051 World
          ./.lake/build/bin/opsSmoke 127.0.0.1 50051
          # run-soak starts its own server and may reclaim port 50051
          ./scripts/run-soak.sh
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          ./.lake/build/bin/routeGuideServer &
          pid=$!
          sleep 0.5
          ./.lake/build/bin/routeGuideClient 127.0.0.1 50052
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

  stress-framing:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: leanprover/lean-action@f3ad22e9ca29cb9475bc9bee9afd1f39bb52bf6d # v1.1.2
        with:
          test: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install native deps (zlib / OpenSSL)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config zlib1g-dev
      - name: Stress demos + peer-framing matrix (hard gate)
        run: |
          chmod +x scripts/run-stress-demos.sh
          export LEAN_GRPC_DEMO_OPS=1
          ./scripts/run-stress-demos.sh

  interop-grpc-go:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: leanprover/lean-action@f3ad22e9ca29cb9475bc9bee9afd1f39bb52bf6d # v1.1.2
        with:
          test: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install Go interop tools
        run: |
          go install google.golang.org/grpc/interop/client@v1.73.0
          go install google.golang.org/grpc/interop/server@v1.73.0
      - name: Build Lean interop binaries
        run: lake build interopServer interopClient
      - name: Lean server ← grpc-go client
        run: |
          chmod +x scripts/interop-lean-go.sh scripts/run-go-to-lean.sh
          ./scripts/run-go-to-lean.sh
      - name: Lean client → grpc-go server
        run: |
          chmod +x scripts/interop-go-lean.sh
          GRPC_PORT=10001 ./scripts/interop-go-lean.sh
      - name: Compression Go↔Lean (gzip codec)
        run: |
          chmod +x scripts/interop-compress-go-lean.sh scripts/build_native.sh
          sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config zlib1g-dev
          ./scripts/interop-compress-go-lean.sh
      - name: In-process TLS Lean → Go
        run: |
          chmod +x scripts/interop-tls-go-lean.sh scripts/gen-test-certs.sh scripts/fetch-openssl-headers.sh
          sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
          ./scripts/interop-tls-go-lean.sh

  interop-python:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: leanprover/lean-action@f3ad22e9ca29cb9475bc9bee9afd1f39bb52bf6d # v1.1.2
        with:
          test: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Lean interop binaries
        run: lake build interopServer interopClient
      - name: Python client → Lean server
        run: |
          chmod +x scripts/run-python-to-lean.sh
          ./scripts/run-python-to-lean.sh
      - name: Lean client → Python server
        run: |
          chmod +x scripts/interop-lean-python.sh
          GRPC_PORT=10001 ./scripts/interop-lean-python.sh

  interop-rust:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          test: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Lean interop binaries
        run: lake build interopServer interopClient
      - name: Rust client → Lean server
        run: |
          chmod +x scripts/run-rust-to-lean.sh
          ./scripts/run-rust-to-lean.sh
      - name: Lean client → Rust server
        run: |
          chmod +x scripts/interop-lean-rust.sh
          GRPC_PORT=10001 ./scripts/interop-lean-rust.sh

  h2spec:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: leanprover/lean-action@f3ad22e9ca29cb9475bc9bee9afd1f39bb52bf6d # v1.1.2
        with:
          test: false
      - name: h2spec full (hard gate)
        run: |
          chmod +x scripts/h2spec.sh
          ./scripts/h2spec.sh
      - name: Upload h2spec log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2spec-log
          path: /tmp/lean-grpc-h2spec.txt
          if-no-files-found: ignore
